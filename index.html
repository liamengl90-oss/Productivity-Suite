<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Signal Path</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span><span class="bt">Signal Path</span></div>
  <div class="top-actions">
    <button id="btn-new" title="New note (Ctrl+N)">+ Note</button>
    <button id="btn-dir" title="New folder (Ctrl+Shift+N)">+ Folder</button>
    <button id="btn-vault" title="Open folder (Ctrl+O)">Open vault</button>
    <button id="btn-tasks" title="Daily tasks">Tasks</button>
    <button id="btn-gantt" title="Gantt chart">Gantt</button>
    <button id="btn-pomo" title="Pomodoro timer (Space starts and pauses)">Pomodoro</button>
    <button id="btn-health" title="Health log">Health</button>
    <button id="btn-finance" title="Finance">Finance</button>
  </div>
  <div class="vault-name" id="vault-name"></div>
</header>
<div class="body">
  <aside class="side">
    <div class="side-tabs"><span class="on">Library</span></div>
    <input id="filter" class="filter" placeholder="Search notes" autocomplete="off">
    <div id="tree" class="tree"></div>
  </aside>
  <main class="main">
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </main>
  <section id="tasks" class="tasks"></section>
  <section id="gantt" class="gantt"></section>
  <section id="pomo" class="pomo"></section>
  <section id="health" class="health"></section>
  <section id="finance" class="finance"></section>
</div>
<div id="ctx" class="ctx" hidden></div>
<script src="renderer.js"></script>
</body>
</html>
